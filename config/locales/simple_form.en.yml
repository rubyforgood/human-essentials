en:
  simple_form:
    "yes": 'Yes'
    "no": 'No'
    required:
      text: 'required'
      mark: '*'
      # `html` is set so the marker carries a class of its own. Styling it by attribute selector
      # would mean matching on the localised title -- "required" here, "necesario" in es -- and a
      # marker that only turns red in one locale is the kind of thing nobody notices.
      # `text` and `mark` are unused while `html` is set; both are left as documentation.
      html: '<abbr class="required-marker" title="required">*</abbr>'
    error_notification:
      default_message: "Please review the problems below:"
