<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <title>Access denied · Human Essentials</title>
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <link rel="icon" type="image/png" sizes="32x32" href="/favicon-32x32.png">
  <!--
    Self-contained on purpose. This page is served straight off disk, including when the app
    is too broken to render anything, so it links no stylesheet and loads nothing remote.
    The values below are the design system's tokens (see design.md).
  -->
  <style>
    /* The typeface is vendored at a stable path, so these pages can look like the app
       without the asset pipeline. If the file is missing the stack falls back to system-ui. */
    @font-face {
      font-family: Figtree;
      font-style: normal;
      font-weight: 400;
      font-display: swap;
      src: url("/vendor/figtree/figtree-latin-400-normal.woff2") format("woff2");
    }
    @font-face {
      font-family: Figtree;
      font-style: normal;
      font-weight: 700;
      font-display: swap;
      src: url("/vendor/figtree/figtree-latin-700-normal.woff2") format("woff2");
    }
    :root {
      --brand-600: #4f46e5;
      --brand-700: #4338ca;
      --slate-50: #f8fafc;
      --slate-200: #e2e8f0;
      --slate-500: #64748b;
      --slate-600: #475569;
      --slate-900: #0f172a;
    }
    * { box-sizing: border-box; }
    body {
      margin: 0;
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 2rem 1.5rem;
      background: var(--slate-50);
      color: var(--slate-900);
      font-family: Figtree, ui-sans-serif, system-ui, -apple-system, "Segoe UI", sans-serif;
      -webkit-font-smoothing: antialiased;
    }
    main { max-width: 30rem; text-align: center; }
    .tile {
      display: inline-grid;
      place-items: center;
      width: 3rem;
      height: 3rem;
      border-radius: 0.75rem;
      background: #eef2ff;
      color: var(--brand-600);
      font-size: 1.05rem;
      font-weight: 700;
      letter-spacing: -0.02em;
    }
    h1 {
      margin: 1rem 0 0;
      font-size: 1.5rem;
      font-weight: 700;
      letter-spacing: -0.02em;
    }
    p {
      margin: 0.5rem 0 0;
      font-size: 0.875rem;
      line-height: 1.6;
      color: var(--slate-600);
    }
    a.button {
      display: inline-flex;
      align-items: center;
      gap: 0.375rem;
      margin-top: 1.5rem;
      padding: 0.5rem 0.875rem;
      border-radius: 0.5rem;
      background: var(--brand-600);
      color: #fff;
      font-size: 0.875rem;
      font-weight: 500;
      text-decoration: none;
    }
    a.button:hover { background: var(--brand-700); }
    a.button:focus-visible { outline: 2px solid var(--brand-600); outline-offset: 2px; }
    footer {
      margin-top: 2.5rem;
      padding-top: 1.25rem;
      border-top: 1px solid var(--slate-200);
      font-size: 0.75rem;
      color: var(--slate-500);
    }
    footer a { color: var(--brand-700); font-weight: 500; }
  </style>
</head>
<body>
  <main>
    <span class="tile" aria-hidden="true">403</span>
    <h1>Access denied</h1>
    <p>You don&rsquo;t have permission to view this page. If you think you should, ask an administrator at your organization.</p>
    <a class="button" href="/">Back to Human Essentials</a>
    <footer>
      Built by <a href="https://rubyforgood.org">Ruby for Good</a>.
    </footer>
  </main>
</body>
</html>
